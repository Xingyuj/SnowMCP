parameters:
  - name: "repository"
  - name: "projectName"
  - name: "pushToProdAcr"

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true
    clean: true
      
  - script: |
      curl -LsSf https://astral.sh/uv/0.12.5/install.sh | sh
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: 'Install uv'
  
  - script: |
      uv sync --frozen --extra dev
    displayName: 'Install dependencies'

  - script: |
      uv run ruff check src/servicenow_mcp tests
    displayName: 'Linting'

  - script: |
      uv run python -m pytest
    displayName: 'Testing'
    condition: succeeded()

  - task: Docker@2
    displayName: Build - ${{ parameters.projectName  }}
    condition: succeeded()
    inputs:
      containerRegistry: "ACR2:TEST"
      repository: "${{ parameters.repository  }}"
      command: "build"
      Dockerfile: "Dockerfile"
      buildContext: "$(System.DefaultWorkingDirectory)"

  - task: Docker@2
    displayName: Push - ${{ parameters.projectName  }}
    condition: succeeded()
    inputs:
      containerRegistry: "ACR2:TEST"
      repository: "${{ parameters.repository  }}"
      command: "push"
      tags: $(imageTag)
