{{- $name := include "servicenowautomation-mcp.fullname" . -}}

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{ $name }}-pdb"
  labels:
    {{- include "servicenowautomation-mcp.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $name }}
