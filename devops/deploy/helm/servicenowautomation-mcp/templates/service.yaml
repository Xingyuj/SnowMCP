{{- $name := include "servicenowautomation-mcp.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: "{{ $name }}-svc"
  labels:
    {{- include "servicenowautomation-mcp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "servicenowautomation-mcp.selectorLabels" . | nindent 4 }}
