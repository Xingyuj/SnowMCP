apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "servicenowautomation-mcp.fullname" . }}-test-connection"
  labels:
    {{- include "servicenowautomation-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['http://{{ include "servicenowautomation-mcp.fullname" . }}-svc:{{ .Values.service.port }}/mcp/ready']
  restartPolicy: Never
