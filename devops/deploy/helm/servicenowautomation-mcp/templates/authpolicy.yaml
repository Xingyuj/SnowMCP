{{- $name := include "servicenowautomation-mcp.fullname" . -}}
{{- $authPolicy := include "servicenowautomation-mcp.authpolicy" . -}}

{{- if eq (lower (toString .Values.inf.conf.authpolicy)) "true" }}
# Restrict inbound service traffic.
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: "{{ $name }}-ap"
  labels:
    {{- include "servicenowautomation-mcp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "servicenowautomation-mcp.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-int-service-account" {{ $authPolicy }}]
    - source:
        namespaces: ["{{ .Values.namespace }}", "istio-system"]
    # to:
    # - operation:
    #     methods: ["GET"]
{{- end }}
