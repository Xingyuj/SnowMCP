{{- if .Values.authorizationPolicyBootstrap }}
{{- $name := include "servicenowautomation-mcp.fullname" . -}}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: "{{ $name }}-bootstrap-ap"
  labels:
    {{- include "servicenowautomation-mcp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  {{- include "servicenowautomation-mcp.authorizationPolicySpec" . | nindent 2 }}
{{- end }}