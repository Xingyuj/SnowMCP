---
# Default values for servicenowautomation-mcp backend.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
pathBase: /servicenowautomation-mcp

image:
  registry: devopsdockercontainers.azurecr.io
  repository: servicenowautomation/servicenowautomation-mcp
  appdrepository: appdynamics/dotnet-core-agent
  appdtag: latest
  tag: latest
  oparepository: bupabase/opa
  opatag: latest-istio
  pullPolicy: IfNotPresent


nameOverride: ""
fullnameOverride: ""
certThumbprints: 558be30612a827eb80e6fc07a50e8e10daa47166c13123b05201c2264f876839
namespace: servicenowautomation-dev-ns

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""


podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  limits:
    cpu: 200m
    memory: 5Gi
  requests:
    cpu: 40m
    memory: 256Mi

# autoscaling:
#   enabled: false
#   minReplicas: 1
#   maxReplicas: 100
#   targetCPUUtilizationPercentage: 80
#   # targetMemoryUtilizationPercentage: 80

probes:
  liveness:
    enabled: false
    path: /api/health
    timeoutSeconds: 5
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
    port: 8080
  readiness:
    enabled: false
    path: /api/health?ready=true  # Use proper readiness endpoint
    timeoutSeconds: 10
    initialDelaySeconds: 30       # Reduced since readiness should be faster
    periodSeconds: 15             # More frequent readiness checks
    failureThreshold: 3           # Faster readiness failure detection
    port: 8080

nodeSelector: { kubernetes.io/os: linux , kubernetes.azure.com/mode: user }

tolerations: []

affinity: {}


env:
  # values define environment variables with a fixed value (no configmap involved) (name is name of var, and value is its value)
  fixed: {}
  # dict with configMapKeyRef. The value of each key, will result in a key in the ConfigMap
  # so keep the name aligned with the ConfigMap name
  configMapRef: {}

configMap:
  # - name: config-servicenowautomation-mcp
  #   data:
  #     api_name: servicenowautomation-mcp
  #     api_version: servicenowautomation-mcp

# MCP Server configuration
mcp:
  args:
    accessLevel: "readwrite"
    transport: "streamable-http"
    host: "0.0.0.0"
    port: 8000
    timeout: 600
