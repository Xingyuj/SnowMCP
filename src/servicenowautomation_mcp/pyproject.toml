[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicenowautomation-mcp"
version = "1.0.0"
description = "Bupa ServiceNowAutomation - Sync FASTMCP for servicenowautomation services"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Bupa Team", email = "team@bupa.com"},
]
keywords = ["fastmcp", "mcp", "python", "api", "xapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastmcp==3.2.4",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.1.0",
    "azure-identity>=1.14.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "ruff>=0.15.12",
    "azure-monitor-opentelemetry>=1.8.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.26.0",
    "faker>=22.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.setuptools]
package-dir = {"servicenowautomation_mcp" = "."}
packages = [
    "servicenowautomation_mcp",
    "servicenowautomation_mcp.handlers",
    "servicenowautomation_mcp.tools",
    "servicenowautomation_mcp.context"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests requiring external services (e.g. Cosmos DB emulator)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
isort = { known-first-party = ["servicenowautomation_mcp"] }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]
